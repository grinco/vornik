  "qwen3.5:9b":            { input: 0.10, output: 0.15 } # openrouter.ai/qwen/qwen3.5-9b
  "qwen3.6:35b":           { input: 0.14, output: 1.00 } # openrouter.ai/qwen/qwen3.6-35b-a3b
  "qwen3-vl:8b":           { input: 0.12, output: 0.46 } # openrouter.ai/qwen/qwen3-vl-8b-instruct
