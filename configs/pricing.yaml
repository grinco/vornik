  "bge-m3:latest":                    { input: 0.01, output: 0.0 } # openrouter.ai/baai/bge-m3
  "nomic-embed-text-v2-moe:latest":   { input: 0.02, output: 0.0 } # ESTIMATE — Nomic v2 MoE has no commercial API tier (open-weight, self-host-only); reused OpenAI text-embedding-3-small as a comparable-class reference
