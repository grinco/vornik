<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Vornik">
  <title>Vornik</title>
  <!-- The product glyph (internal/ui/static/icon.svg), re-cut for a README hero:
       same cadet-teal ground, same peach centre, but the orbiting nodes are drawn
       at full opacity and slightly larger, because a 96px hero is not a 16px
       favicon and the mesh reads as noise when it is too faint. -->
